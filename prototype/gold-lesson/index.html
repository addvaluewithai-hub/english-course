<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="نموذج تفاعلي للدرس الذهبي: قدّم نفسك بالإنجليزية.">
  <title>قدّم نفسك | Gold Lesson</title>
  <link rel="stylesheet" href="styles/foundation.css">
  <link rel="stylesheet" href="styles/lesson.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">English <span>with purpose</span></a>
    <div class="top-actions">
      <button class="quiet" id="privacyButton" type="button">الخصوصية</button>
      <span class="level">A1</span>
    </div>
  </header>

  <main class="shell">
    <aside class="rail" aria-label="تقدّم الدرس">
      <p class="eyebrow">GOLD LESSON · 01</p>
      <h1>قدّم نفسك</h1>
      <p class="muted">Introduce yourself</p>
      <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
      <p id="progressText" class="progress-copy">الخطوة 1 من 9</p>
      <ol id="stepList" class="step-list"></ol>
      <p class="safe-note">يمكنك استخدام شخصية خيالية. لا نحفظ إجاباتك.</p>
    </aside>

    <section class="stage" aria-live="polite">
      <div id="stepHost"></div>
      <nav class="lesson-nav" aria-label="التنقل داخل الدرس">
        <button id="backButton" class="button secondary" type="button">السابق</button>
        <button id="nextButton" class="button primary" type="button">التالي</button>
      </nav>
    </section>
  </main>

  <dialog id="privacyDialog">
    <h2>خصوصيتك</h2>
    <p>هذا نموذج محلي. لا يرسل إجابتك ولا يحفظها بعد تحديث الصفحة. استخدم معلومات خيالية إذا أردت.</p>
    <button class="button primary" id="closePrivacy" type="button">فهمت</button>
  </dialog>

  <template id="choiceTemplate">
    <button class="choice" type="button"><span></span><b aria-hidden="true">○</b></button>
  </template>
  <script src="scripts/data.js"></script>
  <script src="scripts/checks.js"></script>
  <script src="scripts/views.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
