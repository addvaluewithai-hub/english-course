name: Audit B1 Stage 4 words

# Mechanical frozen-policy expansion only. Human lexical decisions live in
# curriculum/levels/b1/design-review/04-words/{word-review.md,word-home-decisions.json}.
on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - curriculum/levels/b1/words.json
      - curriculum/levels/b1/design-review/04-words/**
      - scripts/build_b1_word_home_map.py
      - .github/workflows/audit-b1-stage04-words.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand and validate frozen B1 word-home decisions
        run: python scripts/build_b1_word_home_map.py
      - name: Commit deterministic word-home audit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add curriculum/levels/b1/design-review/04-words/generated
          if ! git diff --cached --quiet; then
            git commit -m 'Update B1 word-home audit snapshot [skip ci]'
            git pull --rebase origin curriculum/level-source-of-truth-v1
            git push origin HEAD:curriculum/level-source-of-truth-v1
          fi
