name: Build A1 curriculum cluster map

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/build_a1_curriculum_cluster_map.py'
      - 'curriculum/levels/a1/abilities.json'
      - 'curriculum/levels/a1/words.json'
      - 'curriculum/levels/a1/phrases.json'
      - 'curriculum/levels/a1/grammar.json'
      - 'data/reviewed/a1-reconciliation-worklist-v1.json'
      - 'data/reviewed/a1-lexical-chunk-ownership-v1.json'
      - 'data/reviewed/a1-grammar-coverage-ownership-v1.json'
      - '.github/workflows/build-a1-cluster-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build cluster map candidate
        run: python scripts/build_a1_curriculum_cluster_map.py
      - name: Commit generated map
        run: |
          git add curriculum/levels/a1/curriculum-map
          if git diff --cached --quiet; then
            echo 'Cluster map already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'curriculum: generate A1 cluster map v0'
          git push
