name: Audit B1 Stage 3 grammar

# Mechanical accounting only. Human grammar-system decisions live in
# curriculum/levels/b1/design-review/03-grammar/grammar-review.md.
on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - curriculum/levels/b1/design-review/03-grammar/**
      - scripts/audit_b1_stage03_grammar.py
      - .github/workflows/audit-b1-stage03-grammar.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate B1 Stage 3 exact grammar accounting
        run: python scripts/audit_b1_stage03_grammar.py
