# A1 semantic-lock generation is intentionally isolated from lesson production.
name: Build A1 semantic lock candidate

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/build_a1_semantic_lock.py'
      - 'scripts/apply_a1_semantic_lock_decisions.py'
      - 'scripts/build_a1_word_review_context.py'
      - 'scripts/finalize_a1_semantic_lock.py'
      - 'curriculum/levels/a1/semantic-lock/manual-decisions.json'
      - 'curriculum/levels/a1/semantic-lock/phrase-control-decisions.json'
      - 'curriculum/levels/a1/semantic-lock/word-control-decisions.json'
      - 'curriculum/levels/a1/words.json'
      - 'curriculum/levels/a1/phrases.json'
      - 'curriculum/levels/a1/grammar.json'
      - 'curriculum/levels/a1/abilities.json'
      - 'curriculum/levels/a1/pronunciation.json'
      - 'curriculum/levels/a1/design-review/06-coverage-ledger/generated/coverage-ledger.json'
      - 'data/reviewed/a1-lexical-chunk-ownership-v1.json'
      - 'data/reviewed/a1-grammar-coverage-ownership-v1.json'
      - '.github/workflows/build-a1-semantic-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build conservative semantic lock candidate
        run: python scripts/build_a1_semantic_lock.py
      - name: Build pending-word review context
        run: python scripts/build_a1_word_review_context.py
      - name: Apply reviewed semantic decisions
        run: python scripts/apply_a1_semantic_lock_decisions.py
      - name: Finalize A1 manifest and exit contract
        run: python scripts/finalize_a1_semantic_lock.py
      - name: Commit generated semantic lock
        run: |
          if [ -z "$(git status --porcelain -- curriculum/levels/a1/semantic-lock curriculum/levels/a1/manifest.json curriculum/levels/a1/exit_contract.json)" ]; then
            echo 'A1 semantic lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add curriculum/levels/a1/semantic-lock/semantic-lock-candidate.json \
                  curriculum/levels/a1/semantic-lock/semantic-lock-report.json \
                  curriculum/levels/a1/semantic-lock/review-queue-compact.json \
                  curriculum/levels/a1/semantic-lock/word-review-context.json \
                  curriculum/levels/a1/semantic-lock/word-review-context.md \
                  curriculum/levels/a1/manifest.json \
                  curriculum/levels/a1/exit_contract.json
          git commit -m 'curriculum: finalize A1 semantic lock'
          git push
