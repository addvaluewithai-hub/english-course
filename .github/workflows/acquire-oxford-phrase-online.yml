name: Acquire current Oxford Phrase List online

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/acquire_oxford_phrase_online.py'
      - '.github/workflows/acquire-oxford-phrase-online.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire and parse current official list
        run: |
          python -m pip install --quiet beautifulsoup4
          python scripts/acquire_oxford_phrase_online.py
      - name: Commit verified web snapshot and extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/raw/vocabulary/oxford-phrase-list-online.html data/derived/oxford-phrase-list-online.json
          if git diff --cached --quiet; then
            echo 'Current web snapshot already current.'
            exit 0
          fi
          git commit -m 'sources: add current Oxford Phrase List web snapshot'
          git push
