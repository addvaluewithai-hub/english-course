name: Audit A1 coverage ledger

# This audit verifies exact source-record lifecycle coverage and introduction load.
# Semantic control roles are reviewed separately and must not silently remove records.
on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - curriculum/levels/a1/**
      - scripts/build_a1_coverage_ledger.py
      - scripts/run_a1_coverage_ledger.py
      - scripts/analyze_a1_coverage_load.py
      - .github/workflows/audit-a1-coverage-ledger.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact source-record ledger
        id: ledger
        shell: bash
        run: |
          set +e
          python scripts/run_a1_coverage_ledger.py \
            --output /tmp/a1-coverage-ledger.json \
            --report /tmp/a1-coverage-report.md \
            > /tmp/a1-coverage-run.log 2>&1
          status=$?
          set -e
          cat /tmp/a1-coverage-run.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

          out=curriculum/levels/a1/design-review/06-coverage-ledger/generated
          mkdir -p "$out"
          rm -f \
            "$out/coverage-ledger.json" \
            "$out/coverage-report.md" \
            "$out/coverage-audit-failure.txt" \
            "$out/load-attribution.md"
          if [[ -f /tmp/a1-coverage-ledger.json ]]; then
            cp /tmp/a1-coverage-ledger.json "$out/coverage-ledger.json"
          fi
          if [[ -f /tmp/a1-coverage-report.md ]]; then
            cp /tmp/a1-coverage-report.md "$out/coverage-report.md"
          else
            cp /tmp/a1-coverage-run.log "$out/coverage-audit-failure.txt"
          fi
          if [[ -f "$out/coverage-ledger.json" ]]; then
            python scripts/analyze_a1_coverage_load.py
          fi

      - name: Commit deterministic audit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/levels/a1/design-review/06-coverage-ledger/generated
          if ! git diff --cached --quiet; then
            git commit -m "Update A1 coverage ledger audit snapshot [skip ci]"
            git push
          fi

      - name: Enforce audit result
        shell: bash
        run: exit ${{ steps.ledger.outputs.status }}
