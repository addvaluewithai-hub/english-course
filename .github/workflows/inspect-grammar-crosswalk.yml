name: Inspect grammar crosswalk

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/inspect_grammar_crosswalk.py'
      - '.github/workflows/inspect-grammar-crosswalk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_grammar_crosswalk.py
