name: Audit B1 semantic lock

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - curriculum/levels/b1/abilities.json
      - curriculum/levels/b1/phrases.json
      - curriculum/levels/b1/grammar.json
      - curriculum/levels/b1/words.json
      - curriculum/levels/b1/pronunciation.json
      - curriculum/levels/b1/design-review/04-words/generated/word-home-map.json
      - curriculum/levels/b1/design-review/06-coverage-ledger/generated/coverage-ledger.json
      - curriculum/levels/b1/design-review/07-lesson-briefs/**
      - curriculum/levels/b1/design-review/08-semantic-lock/**
      - scripts/build_b1_semantic_role_ledger.py
      - .github/workflows/audit-b1-semantic-lock.yml
  workflow_dispatch:

concurrency:
  group: b1-curriculum-audit-snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand and validate human B1 Stage 8 semantic decisions
        run: python scripts/build_b1_semantic_role_ledger.py
      - name: Commit deterministic B1 semantic snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/levels/b1/design-review/08-semantic-lock/generated
          if ! git diff --cached --quiet; then
            git commit -m "Update B1 semantic-lock audit snapshot [skip ci]"
            git pull --rebase origin curriculum/level-source-of-truth-v1
            git push origin HEAD:curriculum/level-source-of-truth-v1
          fi
