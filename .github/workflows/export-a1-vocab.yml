name: A1 vocab app export

on:
  pull_request:
    paths:
      - 'scripts/export-a1-vocab-app.py'
      - '.github/workflows/export-a1-vocab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Verify runner
        run: |
          python --version
          echo "A1 vocab export runner is available"
