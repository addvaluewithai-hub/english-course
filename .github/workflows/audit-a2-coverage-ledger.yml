name: Audit A2 coverage ledger

# Exact A2 source-record lifecycle audit. Semantic control roles are decided later
# in Stage 08 and reconciled with this provisional lifecycle in Stage 08.5.
on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - curriculum/levels/a2/**
      - scripts/build_a2_coverage_ledger.py
      - scripts/analyze_a2_coverage_ledger.py
      - scripts/build_a2_word_home_map.py
      - .github/workflows/audit-a2-coverage-ledger.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild exact frozen A2 word homes
        run: python scripts/build_a2_word_home_map.py

      - name: Build exact A2 source-record ledger
        id: ledger
        shell: bash
        run: |
          set +e
          python scripts/build_a2_coverage_ledger.py \
            --output /tmp/a2-coverage-ledger.json \
            --report /tmp/a2-coverage-report.md \
            > /tmp/a2-coverage-run.log 2>&1
          status=$?
          set -e
          cat /tmp/a2-coverage-run.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

          out=curriculum/levels/a2/design-review/06-coverage-ledger/generated
          mkdir -p "$out"
          rm -f \
            "$out/coverage-ledger.json" \
            "$out/coverage-report.md" \
            "$out/coverage-audit-failure.txt" \
            "$out/gap-attribution.md"
          if [[ -f /tmp/a2-coverage-ledger.json ]]; then
            cp /tmp/a2-coverage-ledger.json "$out/coverage-ledger.json"
          fi
          if [[ -f /tmp/a2-coverage-report.md ]]; then
            cp /tmp/a2-coverage-report.md "$out/coverage-report.md"
          else
            cp /tmp/a2-coverage-run.log "$out/coverage-audit-failure.txt"
          fi

      - name: Generate lifecycle gap attribution
        if: always()
        shell: bash
        run: |
          ledger=curriculum/levels/a2/design-review/06-coverage-ledger/generated/coverage-ledger.json
          if [[ -f "$ledger" ]]; then
            python scripts/analyze_a2_coverage_ledger.py
          fi

      - name: Commit deterministic audit snapshot
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            curriculum/levels/a2/design-review/04-words/generated \
            curriculum/levels/a2/design-review/06-coverage-ledger/generated
          if ! git diff --cached --quiet; then
            git commit -m "Update A2 coverage ledger audit snapshot [skip ci]"
            git push
          fi

      - name: Enforce audit result
        shell: bash
        run: exit ${{ steps.ledger.outputs.status }}
