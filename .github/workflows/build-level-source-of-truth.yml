name: Build level source of truth

# Generation order matters: base inventories -> grammar enrichment -> granular abilities
# -> compact non-authoritative review aids -> frozen A2 word-home expansion
# -> reviewed A1 semantic finalization -> Stage-07 delivery-boundary normalization
# -> reviewed A2 Stage-9 authorization finalization -> reviewed B1 Stage-9 authorization finalization.
on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/build_level_source_of_truth.py'
      - 'scripts/build_level_abilities.py'
      - 'scripts/enrich_level_grammar.py'
      - 'scripts/build_level_design_review_aids.py'
      - 'scripts/build_a2_word_home_map.py'
      - 'scripts/finalize_a1_semantic_lock.py'
      - 'scripts/finalize_a1_stage07_handoff.py'
      - 'scripts/finalize_a2_authorization.py'
      - 'scripts/finalize_b1_authorization.py'
      - 'curriculum/levels/**'
      - 'data/derived/egp-all-levels.json'
      - 'data/derived/gse-grammar-all.json'
      - 'data/derived/oxford-3000-all.json'
      - 'data/derived/oxford-5000-all.json'
      - 'data/derived/oxford-phrase-list-online.json'
      - 'data/derived/gse-vocabulary-c2-gl.json'
      - 'data/derived/gse-vocabulary-c2-gl-audit.json'
      - 'data/derived/cefr-all-descriptors.json'
      - 'data/derived/gse-all-objectives.json'
      - 'data/reviewed/grammar-family-strands-v1.json'
      - 'data/reviewed/communicative-tag-assignments-v1.json'
      - 'data/reviewed/communicative-function-strands-v1.json'
      - 'data/reviewed/level-exit-profiles-v1.json'
      - 'data/reviewed/pronunciation-progression-strands-v1.json'
      - 'tests/test_level_source_of_truth.py'
      - '.github/workflows/build-level-source-of-truth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build base inventories
        run: python scripts/build_level_source_of_truth.py
      - name: Enrich grammar inventories
        run: python scripts/enrich_level_grammar.py
      - name: Build granular ability inventories
        run: python scripts/build_level_abilities.py
      - name: Build compact design review aids
        run: python scripts/build_level_design_review_aids.py
      - name: Expand frozen A2 manual word-home decisions
        run: python scripts/build_a2_word_home_map.py
      - name: Restore reviewed A1 semantic lock
        run: python scripts/finalize_a1_semantic_lock.py
      - name: Normalize Stage-07 delivery boundary
        run: python scripts/finalize_a1_stage07_handoff.py
      - name: Restore reviewed A2 Stage-9 authorization
        run: python scripts/finalize_a2_authorization.py
      - name: Restore reviewed B1 Stage-9 authorization
        run: python scripts/finalize_b1_authorization.py
      - name: Validate level source of truth
        run: python -m unittest tests.test_level_source_of_truth
      - name: Commit generated inventories and review aids
        run: |
          if [ -z "$(git status --porcelain -- curriculum/levels)" ]; then
            echo 'Generated inventories and review aids already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add curriculum/levels
          git commit -m 'curriculum: generate level inventory candidates'
          git push
