name: Audit B1 Stage 7 lesson briefs

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - curriculum/levels/b1/design-review/05-curriculum-map/**
      - curriculum/levels/b1/design-review/06-coverage-ledger/**
      - curriculum/levels/b1/design-review/06.5-load-sequence-lock/**
      - curriculum/levels/b1/design-review/07-lesson-briefs/**
      - scripts/audit_b1_stage07_briefs.py
      - .github/workflows/audit-b1-stage07-briefs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate B1 Stage 7 briefs against exact Stage 6 ledger
        run: python scripts/audit_b1_stage07_briefs.py
