name: Curriculum integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'curriculum/**'
      - 'data/**'
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'sources/**'
      - 'tests/**'
      - '.github/workflows/curriculum-integrity.yml'
      - 'START_HERE.md'
      - 'CURRENT_STATE.md'
      - 'AGENTS.md'
      - 'HANDOFF.md'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'curriculum/**'
      - 'data/**'
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'sources/**'
      - 'tests/**'
      - '.github/workflows/curriculum-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit source-of-truth integrity
        run: python scripts/audit_level_source_of_truth_v4.py
      - name: Run level source-of-truth tests
        run: python -m unittest tests.test_level_source_of_truth
      - name: Rebuild B2 Stage-06 provisional exact ledger
        id: b2_stage06
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/b2-stage06
          python scripts/build_b2_coverage_ledger.py \
            --output /tmp/b2-stage06/coverage-ledger.json \
            --source-home-index /tmp/b2-stage06/source-home-index.json \
            --report /tmp/b2-stage06/coverage-report.md
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate documented B2 Stage-06 load-warning set
        if: steps.b2_stage06.outputs.exit_code == '0' || steps.b2_stage06.outputs.exit_code == '2'
        run: python scripts/validate_b2_stage06_load_critic.py /tmp/b2-stage06/coverage-report.md
      - name: Verify committed B2 Stage-06 evidence is deterministic
        if: steps.b2_stage06.outputs.exit_code == '0' || steps.b2_stage06.outputs.exit_code == '2'
        shell: bash
        run: |
          cmp /tmp/b2-stage06/coverage-ledger.json curriculum/levels/b2/design-review/06-coverage-ledger/generated/coverage-ledger.json
          cmp /tmp/b2-stage06/source-home-index.json curriculum/levels/b2/design-review/06-coverage-ledger/generated/source-home-index.json
          cmp /tmp/b2-stage06/coverage-report.md curriculum/levels/b2/design-review/06-coverage-ledger/coverage-report.md
      - name: Enforce B2 Stage-06 structural result
        if: steps.b2_stage06.outputs.exit_code != '0' && steps.b2_stage06.outputs.exit_code != '2'
        run: |
          echo "B2 Stage-06 ledger generator exited with structural code ${{ steps.b2_stage06.outputs.exit_code }}"
          exit 1
