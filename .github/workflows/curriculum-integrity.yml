name: Curriculum integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'curriculum/**'
      - 'data/**'
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'sources/**'
      - 'tests/**'
      - '.github/workflows/curriculum-integrity.yml'
      - 'START_HERE.md'
      - 'CURRENT_STATE.md'
      - 'AGENTS.md'
      - 'HANDOFF.md'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'curriculum/**'
      - 'data/**'
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'sources/**'
      - 'tests/**'
      - '.github/workflows/curriculum-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit source-of-truth integrity
        run: python scripts/audit_level_source_of_truth_v4.py
      - name: Run level source-of-truth tests
        run: python -m unittest tests.test_level_source_of_truth
