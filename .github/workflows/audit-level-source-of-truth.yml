name: Audit level source of truth

# A1/A2 curriculum lesson-design authorization is valid only when each reviewed
# semantic/design lock is explicitly closed. Delivery production remains a separate
# TEST-002-gated concern, and later levels remain locked until independently reviewed.
on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/audit_level_source_of_truth.py'
      - 'scripts/audit_level_source_of_truth_v2.py'
      - 'scripts/audit_level_source_of_truth_v3.py'
      - 'scripts/audit_level_source_of_truth_v4.py'
      - 'curriculum/levels/**'
      - 'data/derived/egp-all-levels.json'
      - 'data/derived/gse-grammar-all.json'
      - 'data/derived/oxford-3000-all.json'
      - 'data/derived/oxford-5000-all.json'
      - 'data/derived/oxford-phrase-list-online.json'
      - 'data/derived/gse-vocabulary-c2-gl.json'
      - 'data/reviewed/grammar-family-strands-v1.json'
      - 'data/reviewed/communicative-tag-assignments-v1.json'
      - 'data/reviewed/communicative-function-strands-v1.json'
      - 'data/reviewed/pronunciation-progression-strands-v1.json'
      - 'data/reviewed/level-exit-profiles-v1.json'
      - '.github/workflows/audit-level-source-of-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit complete source coverage and reviewed lesson-design authorization
        run: python scripts/audit_level_source_of_truth_v4.py
