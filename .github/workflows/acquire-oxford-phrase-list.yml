name: Acquire Oxford Phrase List

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/acquire_oxford_phrase_list.py'
      - '.github/workflows/acquire-oxford-phrase-list.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire official PDF
        run: python scripts/acquire_oxford_phrase_list.py
      - name: Create searchable text mirror
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p data/derived/source-text
          pdftotext -layout sources/raw/vocabulary/oxford-phrase-list.pdf data/derived/source-text/oxford-phrase-list.txt
      - name: Verify published scope marker
        run: |
          grep -F '750 common phrases' data/derived/source-text/oxford-phrase-list.txt
          grep -F 'A1' data/derived/source-text/oxford-phrase-list.txt
          grep -F 'C1' data/derived/source-text/oxford-phrase-list.txt
      - name: Commit verified source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/raw/vocabulary/oxford-phrase-list.pdf data/derived/oxford-phrase-list-source.json data/derived/source-text/oxford-phrase-list.txt
          if git diff --cached --quiet; then
            echo 'Source snapshot already current.'
            exit 0
          fi
          git commit -m 'sources: add verified Oxford Phrase List snapshot'
          git push
