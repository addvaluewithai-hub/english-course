name: Inspect GSE Toolkit acquisition surface

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/inspect_gse_toolkit.py'
      - '.github/workflows/inspect-gse-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public frontend assets
        run: python scripts/inspect_gse_toolkit.py
