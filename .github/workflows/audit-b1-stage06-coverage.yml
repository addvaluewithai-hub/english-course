name: Audit B1 Stage 6 coverage ledger

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - curriculum/levels/b1/**
      - scripts/build_b1_word_home_map.py
      - scripts/build_b1_coverage_ledger.py
      - scripts/run_b1_coverage_ledger.py
      - scripts/analyze_b1_coverage_ledger.py
      - .github/workflows/audit-b1-stage06-coverage.yml
  workflow_dispatch:

concurrency:
  group: b1-curriculum-audit-snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild exact frozen B1 word homes
        run: python scripts/build_b1_word_home_map.py

      - name: Build exact B1 source-record lifecycle ledger with reviewed overlays
        id: ledger
        shell: bash
        run: |
          set +e
          python scripts/run_b1_coverage_ledger.py \
            --output /tmp/b1-coverage-ledger.json \
            --report /tmp/b1-coverage-report.md \
            > /tmp/b1-coverage-run.log 2>&1
          status=$?
          set -e
          cat /tmp/b1-coverage-run.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

          out=curriculum/levels/b1/design-review/06-coverage-ledger/generated
          mkdir -p "$out"
          rm -f "$out/coverage-ledger.json" "$out/coverage-report.md" "$out/coverage-audit-failure.txt" "$out/gap-attribution.md"
          if [[ -f /tmp/b1-coverage-ledger.json ]]; then
            cp /tmp/b1-coverage-ledger.json "$out/coverage-ledger.json"
          fi
          if [[ -f /tmp/b1-coverage-report.md ]]; then
            cp /tmp/b1-coverage-report.md "$out/coverage-report.md"
          else
            cp /tmp/b1-coverage-run.log "$out/coverage-audit-failure.txt"
          fi

      - name: Generate B1 lifecycle gap attribution
        if: always()
        shell: bash
        run: |
          ledger=curriculum/levels/b1/design-review/06-coverage-ledger/generated/coverage-ledger.json
          if [[ -f "$ledger" ]]; then
            python scripts/analyze_b1_coverage_ledger.py
          fi

      - name: Commit deterministic B1 Stage 6 snapshot
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            curriculum/levels/b1/design-review/04-words/generated \
            curriculum/levels/b1/design-review/06-coverage-ledger/generated
          if ! git diff --cached --quiet; then
            git commit -m "Update B1 Stage 6 coverage audit snapshot [skip ci]"
            git pull --rebase origin curriculum/level-source-of-truth-v1
            git push origin HEAD:curriculum/level-source-of-truth-v1
          fi

      - name: Enforce structural and load audit result
        shell: bash
        run: exit ${{ steps.ledger.outputs.status }}
