name: Audit B1 Stage 4.5 constraints

# Mechanical constraint validation only. Human decisions live in the B1
# Stage-4.5 pronunciation/exit/carry-forward review.
on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - curriculum/levels/b1/pronunciation.json
      - curriculum/levels/b1/exit_contract.json
      - curriculum/levels/a2/exit_contract.json
      - curriculum/levels/b1/design-review/04.5-pronunciation-exit-carry-forward/**
      - scripts/audit_b1_stage045_constraints.py
      - .github/workflows/audit-b1-stage045-constraints.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate B1 Stage 4.5 reviewed constraints
        run: python scripts/audit_b1_stage045_constraints.py
