name: Audit B1 Stage 1 abilities

# Mechanical accounting only. Human curriculum decisions live in
# curriculum/levels/b1/design-review/01-abilities/final-capability-map.md.
# This workflow must never infer or rewrite semantic/capability assignments.
on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - curriculum/levels/b1/design-review/01-abilities/**
      - scripts/audit_b1_stage01_abilities.py
      - .github/workflows/audit-b1-stage01-abilities.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate B1 Stage 1 exact ability accounting
        run: python scripts/audit_b1_stage01_abilities.py
