name: Extract Pearson GSE C2 vocabulary

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/extract_gse_c2_vocabulary.py'
      - '.github/workflows/extract-gse-c2-vocabulary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire and audit C2 General Learner vocabulary
        run: python scripts/extract_gse_c2_vocabulary.py
      - name: Commit derived official API snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/derived/gse-vocabulary-c2-gl.json data/derived/gse-vocabulary-c2-gl-audit.json
          if git diff --cached --quiet; then
            echo 'C2 GSE snapshot already current.'
            exit 0
          fi
          git commit -m 'sources: snapshot Pearson GSE C2 vocabulary'
          git push
