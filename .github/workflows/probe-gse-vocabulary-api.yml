name: Probe Pearson GSE C2 vocabulary API

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/probe_gse_vocabulary_api.py'
      - '.github/workflows/probe-gse-vocabulary-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe tiny C2 request
        run: python scripts/probe_gse_vocabulary_api.py
