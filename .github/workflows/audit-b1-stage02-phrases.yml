name: Audit B1 Stage 2 phrases

# Mechanical accounting only. Human phrase-home decisions live in
# curriculum/levels/b1/design-review/02-phrases/phrase-review.md.
on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - curriculum/levels/b1/design-review/02-phrases/**
      - scripts/audit_b1_stage02_phrases.py
      - .github/workflows/audit-b1-stage02-phrases.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate B1 Stage 2 exact phrase accounting
        run: python scripts/audit_b1_stage02_phrases.py
