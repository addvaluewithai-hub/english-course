name: Inspect communicative assignment schema

on:
  push:
    branches:
      - curriculum/level-source-of-truth-v1
    paths:
      - 'scripts/inspect_communicative_assignments.py'
      - '.github/workflows/inspect-communicative-assignments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curriculum/level-source-of-truth-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect reviewed schema
        run: python scripts/inspect_communicative_assignments.py
